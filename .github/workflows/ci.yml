name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  go-test:
    name: Go Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: false

      - name: Verify Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Files not formatted with gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Run Go Tests
        run: go test -v ./tests/raft/... ./tests/property/... ./tests/marketlog/... ./tests/durability/... ./tests/integration/... -timeout 10m

      - name: Build Binaries
        run: |
          go build -v -o bin/tickraft-node ./cmd/tickraft-node
          go build -v -o bin/tickraft-import ./cmd/tickraft-import
          go build -v -o bin/tickraft-export ./cmd/tickraft-export
          go build -v -o bin/tickraftctl ./cmd/tickraftctl

  python-test:
    name: Python Analytics Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pandas scipy
      - name: Run Python Tests
        run: |
          pytest -v python/tests
