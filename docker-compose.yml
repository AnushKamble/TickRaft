version: '3.8'

services:
  node-1:
    build: .
    container_name: tickraft-node-1
    command: ["-id=node-1", "-listen=:50051", "-peers=node-2=node-2:50052,node-3=node-3:50053", "-data-dir=/data"]
    ports:
      - "50051:50051"
    volumes:
      - node1_data:/data
    networks:
      - raft_net

  node-2:
    build: .
    container_name: tickraft-node-2
    command: ["-id=node-2", "-listen=:50052", "-peers=node-1=node-1:50051,node-3=node-3:50053", "-data-dir=/data"]
    ports:
      - "50052:50052"
    volumes:
      - node2_data:/data
    networks:
      - raft_net

  node-3:
    build: .
    container_name: tickraft-node-3
    command: ["-id=node-3", "-listen=:50053", "-peers=node-1=node-1:50051,node-2=node-2:50052", "-data-dir=/data"]
    ports:
      - "50053:50053"
    volumes:
      - node3_data:/data
    networks:
      - raft_net

volumes:
  node1_data:
  node2_data:
  node3_data:

networks:
  raft_net:
    driver: bridge
